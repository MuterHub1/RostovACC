        <script>
            const tooltip = document.getElementById('tooltip-html');
            const sectors = document.querySelectorAll('.sector');

            sectors.forEach(sector => {
            sector.addEventListener('mouseenter', () => {
                tooltip.textContent = sector.dataset.title;
                tooltip.style.opacity = '1';
            });

            sector.addEventListener('mousemove', (e) => {
                const offset = 12;
                const margin = 5;
                const tooltipWidth = tooltip.offsetWidth;
                const tooltipHeight = tooltip.offsetHeight;
                const screenWidth = window.innerWidth;
                const screenHeight = window.innerHeight;

                let left = e.clientX + offset;
                let top = e.clientY + offset;

                if (left + tooltipWidth > screenWidth - margin) {
                    left = e.clientX - tooltipWidth - offset;
                }

                if (top + tooltipHeight > screenHeight) {
                    top = e.clientY - tooltipHeight - offset;
                }
                

                tooltip.style.left = left + 'px';
                tooltip.style.top = top + 'px';
            });

            sector.addEventListener('mouseleave', () => {
                tooltip.style.opacity = '0';
            });

            });
        </script>
